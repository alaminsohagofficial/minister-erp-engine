<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minister ERP - Dual Dealer Console</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #004085; text-align: center; }
        .card { background: #e9ecef; padding: 15px; margin: 15px 0; border-radius: 6px; }
        button { background: #0056b3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004085; }
        pre { background: #212529; color: #f8f9fa; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Minister ERP Engine Console</h1>
        <p style="text-align: center;">Dual-Dealer Secure Financial Ledger & Gemini AI Hub</p>
        
        <div class="card">
            <h3>Dealer 1: Minister High-Tech Park (DEAL002905)</h3>
            <button onclick="fetchLedger('DEAL002905')">Check Ledger & SAP Allocation</button>
            <button onclick="downloadPdf('DEAL002905')">Download Official PDF</button>
        </div>

        <div class="card">
            <h3>Dealer 2: Salsabila Electronics Park (MDEL000215)</h3>
            <button onclick="fetchLedger('MDEL000215')">Check Ledger & SAP Allocation</button>
            <button onclick="downloadPdf('MDEL000215')">Download Official PDF</button>
        </div>

        <div class="card">
            <h3>System Output Logs</h3>
            <pre id="output">System ready...</pre>
        </div>
    </div>

    <script>
        async function fetchLedger(dealerId) {
            const res = await fetch(`/api/ledger/${dealerId}`);
            const data = await res.json();
            document.getElementById('output').innerText = JSON.stringify(data, null, 2);
        }

        function downloadPdf(dealerId) {
            window.location.href = `/api/generate-pdf/${dealerId}`;
        }
    </script>
</body>
</html>
